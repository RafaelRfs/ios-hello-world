name: Build IPA (sem assinatura)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar para iPhone (sem assinatura)
        run: |
          xcodebuild -version
          xcodebuild build \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HelloWorld.app Payload/
          zip -qr HelloWorld-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-unsigned-ipa
          path: HelloWorld-unsigned.ipa
          retention-days: 30
